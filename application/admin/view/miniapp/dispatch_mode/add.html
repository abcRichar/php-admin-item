<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <div class="form-group">
        <label for="c-template_name" class="control-label col-xs-12 col-sm-2">{:__('Template_name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-template_name" class="form-control" data-rule="required" name="row[template_name]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label for="c-dispatch_order" class="control-label col-xs-12 col-sm-2">{:__('Dispatch_order')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-dispatch_order" class="form-control" name="row[dispatch_order]" type="text" value="">
            <span class="help-block">{:__('Sequence_help_dispatch_order')}</span>
        </div>
    </div>
    <div class="form-group">
        <label for="c-commission_rate" class="control-label col-xs-12 col-sm-2">{:__('Commission_rate')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-commission_rate" class="form-control" name="row[commission_rate]" type="text" value="">
            <span class="help-block">{:__('Sequence_help_commission_rate')}</span>
        </div>
    </div>
    <div class="form-group">
        <label for="c-fixed_commission" class="control-label col-xs-12 col-sm-2">{:__('Fixed_commission')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-fixed_commission" class="form-control" name="row[fixed_commission]" type="text" value="">
            <span class="help-block">{:__('Sequence_help_fixed_commission')}</span>
        </div>
    </div>
    <div class="form-group">
        <label for="c-dispatch_amount" class="control-label col-xs-12 col-sm-2">{:__('Dispatch_amount')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-dispatch_amount" class="form-control" name="row[dispatch_amount]" type="text" value="">
            <span class="help-block">{:__('Sequence_help_dispatch_amount')}</span>
        </div>
    </div>
    <div class="form-group">
        <label for="c-difference_amount" class="control-label col-xs-12 col-sm-2">差额:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-difference_amount" class="form-control" name="row[difference_amount]" type="text" value="">
            <span class="help-block">多个差额用 / 分隔，和派单订单按顺序对应</span>
        </div>
    </div>
    <div class="form-group">
        <label for="c-sort" class="control-label col-xs-12 col-sm-2">{:__('Sort')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-sort" class="form-control" name="row[sort]" type="number" value="0">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', ['1'=>__('Normal'), '0'=>__('Disabled')], 1)}
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-warning btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>

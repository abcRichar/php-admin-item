<style>
    .chat-room-page {display:flex;height:calc(100vh - 170px);min-height:560px;background:#fff;border:1px solid #e5e5e5;}
    .chat-room-list {width:240px;border-right:1px solid #e5e5e5;background:#f8f9fb;overflow:auto;}
    .chat-room-item {padding:14px 16px;border-bottom:1px solid #e9edf2;cursor:pointer;}
    .chat-room-item.active {background:#fff;border-left:3px solid #18bc9c;padding-left:13px;}
    .chat-room-name {font-weight:600;color:#333;}
    .chat-room-last {font-size:12px;color:#999;margin-top:6px;}
    .chat-main {flex:1;display:flex;flex-direction:column;min-width:0;}
    .chat-header {height:52px;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
    .chat-title {font-weight:600;color:#333;}
    .chat-status {font-size:12px;color:#999;}
    .chat-status.online {color:#18bc9c;}
    .chat-status.offline {color:#dd4b39;}
    .chat-messages {flex:1;overflow:auto;padding:16px;background:#f5f7fa;}
    .chat-load-more {text-align:center;margin-bottom:12px;}
    .chat-load-more .btn {padding:3px 12px;}
    .chat-msg {display:flex;margin-bottom:14px;}
    .chat-msg.admin {justify-content:flex-end;}
    .chat-bubble {max-width:68%;background:#fff;border:1px solid #e5e5e5;border-radius:6px;padding:8px 10px;}
    .chat-msg.admin .chat-bubble {background:#e8f8f4;border-color:#cceee6;}
    .chat-meta {font-size:12px;color:#888;margin-bottom:5px;}
    .chat-content {white-space:pre-wrap;word-break:break-word;color:#333;line-height:1.5;}
    .chat-empty {color:#999;text-align:center;margin-top:160px;}
    .chat-input {border-top:1px solid #e5e5e5;padding:12px;background:#fff;}
    .chat-input textarea {resize:none;height:72px;}
    .chat-actions {display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
    .chat-count {font-size:12px;color:#999;}
</style>

<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-body">
        <div class="chat-room-page">
            <div class="chat-room-list" id="chat-room-list">
                {foreach name="rooms" item="room"}
                <div class="chat-room-item" data-room-id="{$room.id|htmlentities}">
                    <div class="chat-room-name">{$room.name|htmlentities}</div>
                    <div class="chat-room-last">{if $room.last_message_time}{$room.last_message_time|date="Y-m-d H:i:s",###}{else /}暂无消息{/if}</div>
                </div>
                {/foreach}
            </div>
            <div class="chat-main">
                <div class="chat-header">
                    <div class="chat-title" id="chat-title">聊天室</div>
                    <div class="chat-status offline" id="chat-status">未连接</div>
                </div>
                <div class="chat-messages" id="chat-messages">
                    <div class="chat-empty">请选择聊天室</div>
                </div>
                <div class="chat-input">
                    <textarea class="form-control" id="chat-content" maxlength="1000" placeholder="输入文字消息"></textarea>
                    <div class="chat-actions">
                        <span class="chat-count"><span id="chat-count">0</span>/1000</span>
                        <button type="button" class="btn btn-success" id="chat-send"><i class="fa fa-send"></i> 发送</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

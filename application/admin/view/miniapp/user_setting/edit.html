<form
  id="edit-form"
  class="form-horizontal"
  role="form"
  data-toggle="validator"
  method="POST"
  action=""
>
  {:token()}
  <div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">{:__('Id')}:</label>
    <div class="col-xs-12 col-sm-8">
      <p class="form-control-static">{$row.id|htmlentities}</p>
    </div>
  </div>
  <div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">{:__('Tel')}:</label>
    <div class="col-xs-12 col-sm-8">
      <p class="form-control-static">{$row.tel|htmlentities}</p>
    </div>
  </div>
  <div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">{:__('Username')}:</label>
    <div class="col-xs-12 col-sm-8">
      <p class="form-control-static">{:$row.username ?: '--'}</p>
    </div>
  </div>
  <div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">{:__('Nickname')}:</label>
    <div class="col-xs-12 col-sm-8">
      <p class="form-control-static">{:$row.nickname ?: '--'}</p>
    </div>
  </div>
  <div class="form-group">
    <label for="c-template_name" class="control-label col-xs-12 col-sm-2"
      >{:__('Template_name')}:</label
    >
    <div class="col-xs-12 col-sm-8">
      <input
        id="c-template_name"
        class="form-control"
        name="row[template_name]"
        type="text"
        value="{$row.template_name|htmlentities}"
      />
    </div>
  </div>
  <div class="form-group">
    <label for="c-dispatch_order" class="control-label col-xs-12 col-sm-2"
      >{:__('Dispatch_order')}:</label
    >
    <div class="col-xs-12 col-sm-8">
      <input
        id="c-dispatch_order"
        class="form-control"
        name="row[dispatch_order]"
        type="text"
        value="{$row.dispatch_order|htmlentities}"
      />
      <span class="help-block"
        >0=下一个订单，多个订单用 / 隔开，例如：1/2/3/4/5</span
      >
    </div>
  </div>
  <div class="form-group">
    <label for="c-commission_rate" class="control-label col-xs-12 col-sm-2"
      >{:__('Commission_rate')}:</label
    >
    <div class="col-xs-12 col-sm-8">
      <input
        id="c-commission_rate"
        class="form-control"
        name="row[commission_rate]"
        type="text"
        value="{$row.commission_rate|htmlentities}"
      />
      <span class="help-block"
        >0=不设置佣金比例，50 表示 50%，多个用 / 隔开，例如：1/2/3/4/5</span
      >
    </div>
  </div>
  <div class="form-group">
    <label for="c-fixed_commission" class="control-label col-xs-12 col-sm-2"
      >{:__('Fixed_commission')}:</label
    >
    <div class="col-xs-12 col-sm-8">
      <input
        id="c-fixed_commission"
        class="form-control"
        name="row[fixed_commission]"
        type="text"
        value="{$row.fixed_commission|htmlentities}"
      />
      <span class="help-block"
        >0=不设置固定佣金。设置固定佣金后佣金比例不生效，多个用 /
        隔开，例如：1/2/3/4/5</span
      >
    </div>
  </div>
  <div class="form-group">
    <label for="c-dispatch_amount" class="control-label col-xs-12 col-sm-2"
      >{:__('Dispatch_amount')}:</label
    >
    <div class="col-xs-12 col-sm-8">
      <input
        id="c-dispatch_amount"
        class="form-control"
        name="row[dispatch_amount]"
        type="text"
        value="{$row.dispatch_amount|htmlentities}"
      />
      <span class="help-block">多个用 / 隔开，例如：1/2/3/4/5</span>
    </div>
  </div>
  <div class="form-group layer-footer">
    <label class="control-label col-xs-12 col-sm-2"></label>
    <div class="col-xs-12 col-sm-8">
      <button type="submit" class="btn btn-success btn-embossed disabled">
        {:__('OK')}
      </button>
      <button type="reset" class="btn btn-warning btn-embossed">
        {:__('Reset')}
      </button>
    </div>
  </div>
</form>

<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <div class="form-group">
        <label for="c-trc20_address" class="control-label col-xs-12 col-sm-2">{:__('Trc20_address')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-trc20_address" class="form-control" rows="3" name="row[trc20_address]">{$row.trc20_address|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label for="c-trc20_qrcode" class="control-label col-xs-12 col-sm-2">{:__('Trc20_qrcode')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-trc20_qrcode" class="form-control" size="35" name="row[trc20_qrcode]" type="text" value="{$row.trc20_qrcode|htmlentities}">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-trc20_qrcode" class="btn btn-danger faupload" data-input-id="c-trc20_qrcode" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="false" data-preview-id="p-trc20_qrcode"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-trc20_qrcode" class="btn btn-primary fachoose" data-input-id="c-trc20_qrcode" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-trc20_qrcode"></ul>
        </div>
    </div>
    <div class="form-group">
        <label for="c-erc20_address" class="control-label col-xs-12 col-sm-2">{:__('Erc20_address')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-erc20_address" class="form-control" rows="3" name="row[erc20_address]">{$row.erc20_address|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label for="c-erc20_qrcode" class="control-label col-xs-12 col-sm-2">{:__('Erc20_qrcode')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-erc20_qrcode" class="form-control" size="35" name="row[erc20_qrcode]" type="text" value="{$row.erc20_qrcode|htmlentities}">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-erc20_qrcode" class="btn btn-danger faupload" data-input-id="c-erc20_qrcode" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="false" data-preview-id="p-erc20_qrcode"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-erc20_qrcode" class="btn btn-primary fachoose" data-input-id="c-erc20_qrcode" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-erc20_qrcode"></ul>
        </div>
    </div>
    <div class="form-group">
        <label for="c-fixed_commission_rate" class="control-label col-xs-12 col-sm-2">{:__('Fixed_commission_rate')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-fixed_commission_rate" class="form-control" data-rule="required;range(0~100)" step="0.01" name="row[fixed_commission_rate]" type="number" value="{$row.fixed_commission_rate|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-parent_rebate_rate" class="control-label col-xs-12 col-sm-2">{:__('Parent_rebate_rate')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-parent_rebate_rate" class="form-control" data-rule="required;range(0~100)" step="0.01" name="row[parent_rebate_rate]" type="number" value="{$row.parent_rebate_rate|htmlentities}">
            <span class="help-block">{:__('Parent_rebate_rate_tip')}</span>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-warning btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
